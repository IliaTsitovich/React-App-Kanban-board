<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Awesome Kanban Board</title>
    <script>
      // Single-Page-App GitHub Pages redirect trick.
      // GH Pages serves this file for any unknown path (e.g. a hard refresh on /login).
      // It rewrites the path into a query string and redirects to the real index.html,
      // where main.jsx restores the original path via history.replaceState.
      var pathSegmentsToKeep = 1; // keep "/React-App-Kanban-board"
      var l = window.location;
      var redirect =
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;
      window.location.replace(redirect);
    </script>
  </head>
  <body></body>
</html>
